<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة نافس – مدرسة الحسن بن علي المتوسطة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f8;--card:#fff;--ink:#10303f;--mute:#5b7482;--line:#dbe5eb;--main:#0d4a6b;--main2:#e4f0f5;--teal:#1f8a87;--gold:#c8962e;--ok:#1d7a46;--okbg:#e2f3e8;--bad:#b3362d;--badbg:#f9e4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a22;--card:#12262f;--ink:#e6f0f4;--mute:#93aab6;--line:#24404c;--main:#5fb8d6;--main2:#17323d;--teal:#4fc3b8;--gold:#e0b04f;--ok:#5fd08a;--okbg:#183a29;--bad:#ff8a80;--badbg:#3f1f1d}}
:root[data-theme="dark"]{--bg:#0b1a22;--card:#12262f;--ink:#e6f0f4;--mute:#93aab6;--line:#24404c;--main:#5fb8d6;--main2:#17323d;--teal:#4fc3b8;--gold:#e0b04f;--ok:#5fd08a;--okbg:#183a29;--bad:#ff8a80;--badbg:#3f1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,"Segoe UI",sans-serif;line-height:1.9;font-size:17px;font-weight:500}
h1,h2,h3.t,.ring span,.brk .big,.score .big{font-family:"Tajawal",Tahoma,"Segoe UI",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
header{margin:-16px -16px 20px;padding:20px 16px 34px;background:linear-gradient(135deg,#0d4a6b 0%,#1f8a87 100%);color:#fff;border-radius:0 0 32px 32px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hd{display:flex;align-items:center;gap:12px;max-width:748px;margin:0 auto}
.ttl{flex:1;text-align:center}
header h1{font-size:22px;margin:0;line-height:1.5;font-weight:700}
header p{margin:0;font-size:14px;opacity:.9}
.pill{display:inline-block;margin-top:6px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.18);font-size:13px}
.lg{height:64px;width:64px;object-fit:contain;background:#fff;border-radius:50%;padding:5px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
h2{font-size:22px;margin:22px 0 4px;color:var(--main)}h3{margin:0}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(13,74,107,.06),0 6px 18px rgba(13,74,107,.05)}
.hero{background:linear-gradient(135deg,#0d4a6b,#16707a);color:#fff;border:0;-webkit-print-color-adjust:exact}
.hero b{font-size:21px;font-family:"Tajawal",Tahoma,sans-serif}
.hero .sub{color:rgba(255,255,255,.88)}
.hero .btn{background:#e8b84a;color:#2a1d00}
.sj{border-top:5px solid var(--c)}
.sh{display:flex;align-items:center;gap:12px}
.sh .ic{font-size:26px;width:50px;height:50px;border-radius:14px 14px 14px 4px;background:color-mix(in srgb,var(--c,#1f8a87) 15%,transparent);display:grid;place-items:center;flex:none}
.sh b{font-size:18px}.sh small{display:block;color:var(--mute);line-height:1.5}
.best{margin-inline-start:auto;text-align:center;font-size:12px;color:var(--mute)}
.best strong{display:block;font-size:19px;color:var(--c,var(--main));font-family:"Tajawal",Tahoma,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:3px 14px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mute);gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 14px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--main));border-radius:6px;transition:width .3s}
.tag{display:inline-block;font-size:12.5px;background:var(--main2);color:var(--main);border-radius:10px;padding:0 12px;margin-bottom:8px}
.q h3{font-size:20px;line-height:2;margin-bottom:14px;font-weight:700}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--teal)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--main2);color:var(--main);display:grid;place-items:center;font-size:15px;font-weight:700}
.opt.sel{border-color:var(--main);background:var(--main2)}
.opt.sel .k{background:var(--main);color:var(--card)}
.nav{display:flex;gap:10px;margin-top:14px}
.nav.sticky{position:sticky;bottom:0;padding:10px 0 8px;background:linear-gradient(to top,var(--bg) 75%,transparent)}
.btn{flex:1;padding:13px 16px;border-radius:14px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--main);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.dots span{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;cursor:pointer;background:var(--card)}
.dots .done{background:var(--main);color:var(--card);border-color:var(--main)}
.dots .cur{outline:2px solid var(--gold);outline-offset:1px}
.brk{text-align:center;padding:30px 16px}
.brk .big{font-size:66px;font-weight:700;color:var(--main);font-variant-numeric:tabular-nums;line-height:1.2}
.score{text-align:center;border-top:5px solid var(--gold)}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:114px;height:114px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:32px;font-weight:700;color:var(--main)}
.lvl{display:inline-block;margin-top:4px;padding:2px 18px;border-radius:20px;background:var(--gold);color:#1d1600;font-weight:700}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px}
.row span:first-child{flex:0 0 38%}
.meter{flex:1;height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:8px}
.row b{flex:0 0 46px;text-align:left}
.sk{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:10px;padding:0 10px;margin:2px;font-size:14px}
.tip{background:var(--main2);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15px}
.rev{border-inline-start:5px solid var(--bad);padding:8px 12px;margin:10px 0;background:var(--bg);border-radius:10px}
.rev.right{border-inline-start-color:var(--ok)}
.rev p{margin:2px 0;font-size:15px}
summary{cursor:pointer;font-weight:700;margin-top:10px}
.oi{background:var(--main2);border-radius:12px;padding:9px 13px;margin-top:10px;font-size:14px;line-height:1.7;color:var(--ink)}.oi b{color:var(--main)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.fl label{flex:1 1 200px;font-size:14px;color:var(--mute)}
.fl input{display:block;width:100%;margin-top:3px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
details.card>summary{margin:0;font-size:19px;font-family:"Tajawal",Tahoma,sans-serif;color:var(--main)}details.card p,details.card li{font-size:15px}
.foot{color:var(--mute);font-size:13px;text-align:center;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.foot b{color:var(--ink)}
@media(max-width:480px){header h1{font-size:18px}.lg{height:52px;width:52px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.nav,.chip,.sticky{display:none}body{background:#fff}}
</style>
</head>

const CL={lugha:"#2f855a",math:"#1d5c96",science:"#0f8a8a"};

let ST={n:"",c:""};try{ST=JSON.parse(localStorage.getItem("hb_student")||"null")||ST}catch(e){}
const INTRO=`<details class="card" open><summary>ما هي اختبارات نافس؟</summary><p>«نافس» اختبارات وطنية تنفذها هيئة تقويم التعليم والتدريب لقياس مستوى تحصيل الطلاب في مواد أساسية، منها الرياضيات والعلوم واللغة العربية، وتعطي مؤشرات عن مستوى الطلاب في المدرسة والمنطقة والمملكة.</p><ul><li>تركز على مهارات الفهم والتحليل وحل المشكلات، لا على الحفظ فقط.</li><li>تهدف إلى تشخيص جوانب القوة والضعف لتحسين التعلم والتعليم.</li><li>أسئلتها غالبًا من متعدد، وبعضها يعتمد على نص أو موقف أو تجربة.</li></ul><p class="sub">هذه المنصة للتدريب على أسلوب الاختبار، وللتفاصيل الرسمية راجع موقع الهيئة.</p></details>`;

function home(){clearInterval(tm);S=null;const b=ld();

<h2>تدريب حسب المادة والوحدة</h2><p class="sub">اختر المادة كاملة أو وحدة محددة لتقوية مهاراتك.</p>`+
Object.entries(D).map(([k,s])=>`<div class="card sj" style="--c:${CL[k]}"><div class="sh"><span class="ic">${s.i}</span><div><b>${s.n}</b><small>${fx(s.Q.length)} سؤالًا · ${fx(s.U.length)} وحدات</small></div><div class="best">أفضل نتيجة<strong>${b[k]!=null?fx(b[k])+"٪":"—"}</strong></div></div>

document.getElementById("full").onclick=()=>begin(Object.keys(D),null);
app.querySelectorAll(".chip").forEach(e=>e.onclick=()=>begin([e.dataset.k],e.dataset.u==null?null:+e.dataset.u))}
function begin(keys,unit){const n=document.getElementById("sn").value.trim();if(!n){alert("اكتب اسم الطالب أولًا");document.getElementById("sn").focus();return}ST={n,c:document.getElementById("sc").value.trim()};try{localStorage.setItem("hb_student",JSON.stringify(ST))}catch(e){}S={keys,idx:0,unit,R:{}};subj()}
function subj(){const k=S.keys[S.idx];const pool=D[k].Q.filter(q=>S.unit==null||q[0]===S.unit);
const qs=sh(S.keys.length>1?sh(pool).slice(0,15):pool).map(q=>{const ix=sh([0,1,2,3]);return{u:q[0],s:q[1],t:q[2],o:ix.map(i=>q[3][i]),a:ix.indexOf(q[4]),e:q[5]}});

function qn(){const c=S.c,q=c.qs[c.i],n=c.qs.length,last=c.i===n-1;
app.innerHTML=`<div class="bar"><span>${D[c.k].n} · السؤال ${fx(c.i+1)} من ${fx(n)}</span><span class="timer" id="tm">${mm(c.left)}</span></div>
<div class="prog"><i style="width:${(c.i+1)/n*100}%"></i></div>
<div class="card q"><span class="tag">${D[c.k].U[q.u]} · ${q.s}</span><h3>${q.t}</h3>${q.o.map((o,j)=>`<button class="opt ${c.ans[c.i]===j?"sel":""}" data-j="${j}"><span class="k">${KL[j]}</span><span>${o}</span></button>`).join("")}</div>${oi(c.k,q)}
<div class="nav sticky"><button class="btn ghost" id="pv" ${c.i?"":"disabled"}>السابق</button><button class="btn" id="nx">${last?"إنهاء المادة":"التالي"}</button></div>
<div class="dots">${c.qs.map((_,j)=>`<span data-g="${j}" class="${c.ans[j]!=null?"done":""} ${j===c.i?"cur":""}">${fx(j+1)}</span>`).join("")}</div>`;
app.querySelectorAll(".opt").forEach(e=>e.onclick=()=>{c.ans[c.i]=+e.dataset.j;qn()});
app.querySelectorAll(".dots span").forEach(e=>e.onclick=()=>{c.i=+e.dataset.g;qn()});
document.getElementById("pv").onclick=()=>{c.i--;qn()};
document.getElementById("nx").onclick=()=>{if(!last){c.i++;qn();return}const m=c.ans.filter(a=>a==null).length;if(!m||confirm("لديك "+fx(m)+" أسئلة بلا إجابة. هل تريد الإنهاء؟"))endSubj()}}
function endSubj(){clearInterval(tm);const c=S.c;c.used=c.tot-Math.max(c.left,0);c.cor=c.qs.filter((q,i)=>c.ans[i]===q.a).length;c.pct=Math.round(c.cor/c.qs.length*100);
S.R[c.k]=c;if(!S.unit)sv(c.k,c.pct);if(S.idx<S.keys.length-1)rest();else report()}
function rest(){let left=BRK;const nx=D[S.keys[S.idx+1]].n;
const go=()=>{clearInterval(tm);S.idx++;subj()};
app.innerHTML=`<div class="card brk"><h2>استراحة ${fx(10)} دقائق</h2><p class="sub">أنهيت مادة ${D[S.c.k].n}. استرح واشرب الماء، والمادة التالية: <b>${nx}</b></p><div class="big" id="bt">${mm(left)}</div><p class="sub">ستبدأ المادة التالية تلقائيًا عند انتهاء الوقت.</p><div class="nav"><button class="btn" id="go">ابدأ الآن</button></div></div>`;
document.getElementById("go").onclick=go;
clearInterval(tm);tm=setInterval(()=>{left--;const t=document.getElementById("bt");if(t)t.textContent=mm(left);if(left<=0)go()},1000)}
function an(c){const U=D[c.k].U.map(n=>({n,c:0,t:0})),sk={};
c.qs.forEach((q,i)=>{const r=c.ans[i]===q.a;U[q.u].t++;if(r)U[q.u].c++;sk[q.s]=sk[q.s]||{c:0,t:0};sk[q.s].t++;if(r)sk[q.s].c++});
return{U:U.filter(u=>u.t),weak:Object.entries(sk).filter(([,v])=>v.c<v.t)}}
function report(){clearInterval(tm);const R=Object.values(S.R),tc=R.reduce((a,c)=>a+c.cor,0),tn=R.reduce((a,c)=>a+c.qs.length,0),tp=Math.round(tc/tn*100),[ln]=lvl(tp);
const meter=(n,c,t)=>{const p=Math.round(c/t*100);return`<div class="row"><span>${n}</span><div class="meter"><i style="width:${p}%;background:${lvl(p)[1]}"></i></div><b>${fx(p)}٪</b></div>`};
let all=[];
const secs=R.map(c=>{const a=an(c);a.U.forEach(u=>all.push({s:D[c.k].n,...u,p:u.c/u.t}));const [l,col]=lvl(c.pct);
return`<div class="card"><div class="sh"><span class="ic">${D[c.k].i}</span><div><b>${D[c.k].n}</b><small>${fx(c.cor)} من ${fx(c.qs.length)} · الزمن ${mm(c.used)}</small></div><div class="best" style="color:${col}"><strong style="color:${col}">${fx(c.pct)}٪</strong>${l}</div></div>
<h3 style="margin-top:12px;font-size:16px">الأداء حسب الوحدة</h3>${a.U.map(u=>meter(u.n,u.c,u.t)).join("")}
${a.weak.length?`<h3 style="margin-top:12px;font-size:16px">مهارات تحتاج مراجعة</h3><div>${a.weak.map(([n,v])=>`<span class="sk">${n} (${fx(v.c)}/${fx(v.t)})</span>`).join("")}</div>`:`<div class="tip">أتقنت جميع المهارات في هذه المادة. أحسنت!</div>`}
<details><summary>مراجعة الأسئلة والشرح</summary>${c.qs.map((q,i)=>{const r=c.ans[i]===q.a;return`<div class="rev ${r?"right":""}"><b>${fx(i+1)}. ${q.t}</b><p>${r?"✅":"❌"} إجابتك: ${c.ans[i]==null?"لم تجب":q.o[c.ans[i]]}</p>${r?"":`<p>الصحيحة: <b>${q.o[q.a]}</b></p>`}<p style="color:var(--mute)">${q.e}</p>${oi(c.k,q)}</div>`}).join("")}</details></div>`}).join("");
all.sort((x,y)=>x.p-y.p);const w=all[0],b=all[all.length-1];
const adv=w.p===1?"أداؤك ممتاز في كل الوحدات، انتقل إلى اختبارات أصعب.":`ابدأ بمراجعة وحدة «${w.n}» في ${w.s}، ثم أعد التدريب عليها من القائمة الرئيسية.`+(b.p>w.p?` وحافظ على تميزك في «${b.n}» (${b.s}).`:"");
const used=R.reduce((a,c)=>a+c.used,0);
app.innerHTML=`<div class="card score"><div style="font-size:15px;color:var(--mute)">الطالب: <b style="color:var(--ink)">${esc(ST.n)}</b> · الفصل: <b style="color:var(--ink)">${esc(ST.c||"—")}</b> · ${new Date().toLocaleDateString("ar-SA")}</div><div>${R.length>1?"نتيجة الاختبار الشامل":D[R[0].k].n}</div><div class="ring" style="--p:${tp};--rc:${lvl(tp)[1]}"><span>${fx(tp)}٪</span></div><div>${fx(tc)} إجابة صحيحة من ${fx(tn)} · الزمن ${mm(used)}</div><span class="lvl">${ln}</span></div>
<div class="card"><h2 style="margin-top:0">تحليل النتائج</h2>${R.map(c=>meter(D[c.k].n,c.cor,c.qs.length)).join("")}
<div class="tip"><b>الأضعف:</b> ${w.n} (${w.s}) بنسبة ${fx(Math.round(w.p*100))}٪<br><b>الأقوى:</b> ${b.n} (${b.s}) بنسبة ${fx(Math.round(b.p*100))}٪<br><b>التوصية:</b> ${adv}</div></div>${secs}
<div class="nav"><button class="btn ghost" id="pr">حفظ التقرير للطباعة</button><button class="btn" id="hm">الرئيسية</button></div>`;
document.getElementById("hm").onclick=home;document.getElementById("pr").onclick=saveRep}
